version: "3"

tasks:
  dev:
    desc: Run backend and frontend concurrently
    deps: [backend, frontend]

  backend:
    desc: Run backend
    cmds:
      - go run . --password 123

  frontend:
    desc: Run frontend
    dir: web
    cmds:
      - pnpm run dev

  worker:
    desc: Run the worker of a product with the Stripe CLI forwarding test webhooks to it, task worker -- MYAPP. Takes INKAN_STRIPE_KEY and the mail service from the environment
    cmds:
      - |
        env="$(mktemp)"
        trap 'rm -f "$env"' EXIT
        go run . worker env {{.CLI_ARGS}} > "$env"
        export INKAN_STRIPE_WEBHOOK_SECRET="$(stripe listen --print-secret)"
        stripe listen --forward-to localhost:4242/webhook \
          --events invoice.paid,checkout.session.completed,checkout.session.async_payment_succeeded &
        trap 'kill $!; rm -f "$env"' EXIT
        PORT=4242 node --env-file="$env" worker/src/node.ts

  seed:
    desc: Fill data/demo with made up products, licenses and 90 days of history
    cmds:
      - rm -rf data/demo && mkdir -p data/demo
      - cat internal/db/schemas/*.sql internal/db/testdata/seed.sql | sqlite3 data/demo/inkan.db

  demo:
    desc: Run the backend on the made up data of task seed
    cmds:
      - go run . --password 123 --data-dir data/demo

  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...
      - cd web && pnpm update --latest

  gen:
    desc: Generate sqlc and the web API client
    cmds:
      - sqlc generate
      - go run . openapi
      - cd web && pnpm openapi-ts && pnpm fmt

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - cd license && go vet ./... && go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  test-sdk:
    desc: Run the verifiers and the worker
    cmds:
      - cd sdk/ts && node --test
      - cd sdk/python && python3 -m unittest
      - cd worker && node --test

  pages:
    desc: Rewrite worker/test/pages.json after a deliberate change of what the worker lists
    cmds:
      - cd worker && UPDATE=1 node --test
      - go test ./internal/mirror/

  vectors:
    desc: Rewrite the test vectors after a deliberate change of the key format
    cmds:
      - cd license && go test -run TestVectors -update .

  build:
    desc: Build binary
    cmds:
      - go generate ./...
      - go build -ldflags="-s -w" -trimpath -o inkan .
