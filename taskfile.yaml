version: "3"

tasks:
  dev:
    desc: Run backend and frontend concurrently
    deps: [backend, frontend]

  backend:
    desc: Run backend
    cmds:
      - go run . --password 123

  frontend:
    desc: Run frontend
    dir: web
    cmds:
      - pnpm run dev

  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...
      - cd web && pnpm update --latest

  gen:
    desc: Generate sqlc and the web API client
    cmds:
      - sqlc generate
      - go run . openapi
      - cd web && pnpm openapi-ts && pnpm fmt

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - cd license && go vet ./... && go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  test-sdk:
    desc: Run the verifiers and the Cloudflare worker against the test vectors
    cmds:
      - cd sdk/ts && node --test
      - cd sdk/python && python3 -m unittest
      - cd workers/cloudflare && node --test

  vectors:
    desc: Rewrite the test vectors after a deliberate change of the key format
    cmds:
      - cd license && go test -run TestVectors -update .

  build:
    desc: Build binary
    cmds:
      - go generate ./...
      - go build -ldflags="-s -w" -trimpath -o inkan .
