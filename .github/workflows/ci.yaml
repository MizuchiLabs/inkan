name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: MizuchiLabs/.github/.github/workflows/go-ci.yaml@main

  # The shared workflow only tests the root module. The license package is a
  # module of its own, the verifiers and the worker are not Go at all.
  contracts:
    name: License package, verifiers and worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: MizuchiLabs/.github/actions/setup@main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: License package
        working-directory: license
        run: |
          go vet ./...
          go test -race -shuffle=on ./...

      - name: TypeScript verifier
        working-directory: sdk/ts
        run: node --test

      - name: Python verifier
        working-directory: sdk/python
        run: |
          pip install cryptography
          python -m unittest

      - name: Worker
        working-directory: worker
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          node --test

  # Runs on main only and skips itself for repos without kos in .goreleaser.yaml.
  nightly:
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: MizuchiLabs/.github/.github/workflows/go-nightly.yaml@main
