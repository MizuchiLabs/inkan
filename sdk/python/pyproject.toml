[project]
# inkan is taken on PyPI.
name = "inkan-license"
version = "0.1.0"
description = "Verify inkan license keys offline"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.urls]
Repository = "https://github.com/MizuchiLabs/inkan"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["inkan.py"]
